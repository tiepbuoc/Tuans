1,"q":"Hút thuốc lá điện tử có nguy cơ gây ra bệnh hô hấp nào sau đây :","o":["Viêm mũi họng","Hội chứng tổn thương phổi cấp (EVALI)","Viêm phế quản cấp","Tất cả đều sai"],"c":1},{"n":42,"q":"Để người sử dụng có thể hít vào, thuốc lá điện tử cần có bộ phận tạo ra:","o":["Khói thuốc","Dung dịch phun sương","Sol khí","Tia nước"],"c":2},{"n":43,"q":"Theo Tổ chức Y tế thế giới, hiện có khoảng bao nhiêu loại hương liệu có trong thuốc lá điện tử","o":["10.000","20.000","30.000","40.000"],"c":1},{"n":44,"q":"Hút thuốc lá điện tử giúp cai thuốc lá điếu truyền thống?","o":["Đúng","Sai"],"c":1},{"n":45,"q":"Theo kết quả điều tra GATS Việt Nam năm 2024, Tỉ lệ hút thuốc lá ở người trưởng thành ở nước ta là:","o":["23,8%;","17,8%;","35,3%;","21,7%."],"c":1},{"n":46,"q":"Theo kết quả điều tra PGATS Việt Nam năm 2024, tỉ lệ nam giới từ 15 tuổi trở lên hút thuốc lá ở nước ta là:","o":["45,3%;","42,3%;","35,3%;","38,9%."],"c":2},{"n":47,"q":"Theo kết quả điều tra PGATS Việt Nam năm 2024, tỉ lệ phơi nhiễm với khói thuốc lá thụ động tại nhà ở nước ta là:","o":["73,1%;","59,9%;","56,0%;","44,9%."],"c":3}];
const $=id=>document.getElementById(id),L="ABCD";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pinned=t=>/^(Cả (ba|3)|Tất cả)/i.test(t);
let list=[],i=0,right=0,wrong=[],locked=false;
function build(src){return src.map(q=>{
 let ix=q.o.map((_,k)=>k);
 if($("shuf").checked){const f=ix.filter(k=>!pinned(q.o[k])),p=ix.filter(k=>pinned(q.o[k]));ix=shuffle(f).concat(p)}
 return{n:q.n,q:q.q,src:q,o:ix.map(k=>q.o[k]),c:ix.indexOf(q.c)}})}
function start(src){list=build(shuffle(src));i=0;right=0;wrong=[];
 $("start").classList.add("hide");$("end").classList.add("hide");$("play").classList.remove("hide");show()}
function show(){const q=list[i];locked=false;
 $("pos").textContent="Câu "+(i+1)+" / "+list.length;$("sc").textContent="Đúng: "+right;
 $("pb").style.width=(i/list.length*100)+"%";$("orig").textContent="Câu số "+q.n+" trong đề cương";
 $("qt").textContent=q.q;$("nx").disabled=true;$("nx").textContent=i==list.length-1?"Xem kết quả":"Câu tiếp theo";
 const box=$("ops");box.innerHTML="";
 q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";
  b.innerHTML="<b>"+L[k]+"</b><span></span>";b.lastChild.textContent=t;b.onclick=()=>pick(k);box.appendChild(b)})}
function pick(k){if(locked)return;locked=true;const q=list[i],bs=$("ops").children;
 [...bs].forEach(b=>b.disabled=true);bs[q.c].classList.add("ok");
 if(k==q.c)right++;else{bs[k].classList.add("no");wrong.push({q,k})}
 $("sc").textContent="Đúng: "+right;$("nx").disabled=false;$("nx").focus()}
function next(){if(i<list.length-1){i++;show()}else finish()}
function finish(){const done=locked?i+1:i;$("play").classList.add("hide");$("end").classList.remove("hide");
 $("rs").textContent=right+" / "+done;
 $("rp").textContent=done?"Tỉ lệ đúng "+Math.round(right/done*100)+"%"+(done<list.length?" (đã dừng ở câu "+done+")":""):"Chưa trả lời câu nào";
 $("redo").classList.toggle("hide",!wrong.length);
 const w=$("wl");w.innerHTML=wrong.length?"<h2 style='font-size:1.1rem;margin:22px 0 0'>Các câu làm sai</h2>":"<p class='g'>Không có câu nào sai. Xuất sắc!</p>";
 wrong.forEach(({q,k})=>{const d=document.createElement("div");d.className="wr";
  d.innerHTML="<p><b></b> <span class='qq'></span></p><p class='r'></p><p class='g'></p>";
  d.querySelector("b").textContent="Câu "+q.n+".";d.querySelector(".qq").textContent=q.q;
  d.children[1].textContent="Bạn chọn: "+q.o[k];d.children[2].textContent="Đáp án đúng: "+q.o[q.c];w.appendChild(d)})}
$("tot").textContent=DATA.length;
$("go").onclick=()=>start(DATA);$("again").onclick=()=>start(DATA);
$("redo").onclick=()=>start(wrong.map(x=>x.q.src));
$("nx").onclick=next;$("qt2").onclick=finish;
document.addEventListener("keydown",e=>{if($("play").classList.contains("hide"))return;
 const k=L.indexOf(e.key.toUpperCase());
 if(e.key.length==1&&k>=0&&k<list[i].o.length&&!locked)pick(k);
 else if(e.key>="1"&&e.key<="4"&&!locked&&+e.key<=list[i].o.length)pick(+e.key-1);
 else if(e.key=="Enter"&&locked){e.preventDefault();next()}});
</script></body></html>
