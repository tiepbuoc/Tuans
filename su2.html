
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giải toán bằng ảnh — AI</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #262626;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --muted: #9a9a9a;
    --accent: #4f8cff;
    --bot-bubble: #333333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    margin-right: auto;
  }
  select#aiProvider {
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 16px 0 16px;
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 14px;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  #dropZone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s;
  }
  #dropZone.dragover {
    border-color: var(--accent);
    color: var(--text);
  }
  #fileInput { display: none; }

  #imgPreviewBar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .preview-thumb {
    position: relative;
    width: 90px;
    height: 90px;
  }
  .preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .preview-thumb button {
    position: absolute;
    top: -7px;
    right: -7px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #b03a3a;
    color: white;
    border: none;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }

  #solveBtn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #solveBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #resultBox {
    background: var(--bot-bubble);
    border-radius: 10px;
    padding: 16px;
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 14.5px;
    min-height: 60px;
  }
  #resultBox.error {
    background: #5a2a2a;
    color: #ffb3b3;
  }
  #resultBox.empty {
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>Giải toán bằng ảnh</h1>
  <select id="aiProvider">
    <option value="claude">Claude Sonnet 5</option>
    <option value="claude-fable">Claude Fable 5</option>
    <option value="gpt">GPT-5.5</option>
  </select>
</header>
<div class="hint">Chỉ cần chụp/tải ảnh đề toán lên, AI sẽ tự giải — không cần gõ gì thêm.</div>

<div id="main">
  <div id="dropZone">
    📷 Bấm để chọn ảnh đề toán (có thể chọn nhiều ảnh cùng lúc)
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div id="imgPreviewBar"></div>

  <button id="solveBtn" disabled>Giải bài</button>

  <div id="resultBox" class="empty">Kết quả sẽ hiển thị ở đây sau khi bạn tải ảnh và bấm "Giải bài".</div>
</div>

<script>
// ==== Cấu hình cố định ====
const BASE_URL = 'https://api.shopaikey.com';
const API_KEY = 'sk-oQ6pVNE2opDGFIjYUJBGmce4zGebF3nMpXHOWWm9kenYc3m2';
const FIXED_PROMPT = 'Tôi đã, đang và sẽ gửi bạn các ảnh chụp của đề toán, hãy giải nó giúp tôi. Hãy giải 1 các từ từ, cẩn thận và đảm bảo không có sai sót, phải kiểm tra lại các câu đã. khi trả ra kết quả cho tôi thì ở trên ghi các lời giải, phía dưới cùng là tổng hợp đáp án.';

const CLAUDE_MODEL = 'claude-sonnet-5';
const CLAUDE_FABLE_MODEL = 'claude-fable-5';
const GPT_MODEL = 'gpt-5.5';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const previewBar = document.getElementById('imgPreviewBar');
const solveBtn = document.getElementById('solveBtn');
const resultBox = document.getElementById('resultBox');
const aiProviderEl = document.getElementById('aiProvider');

let pendingImages = []; // { base64, mediaType, dataUrl }

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFiles(Array.from(e.dataTransfer.files));
});

fileInput.addEventListener('change', (e) => {
  handleFiles(Array.from(e.target.files));
  fileInput.value = '';
});

async function handleFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const dataUrl = await fileToDataURL(file);
    const base64 = dataUrl.split(',')[1];
    pendingImages.push({ base64, mediaType: file.type || 'image/png', dataUrl });
  }
  renderPreviews();
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPreviews() {
  previewBar.innerHTML = '';
  pendingImages.forEach((img, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'preview-thumb';
    thumb.innerHTML = `<img src="${img.dataUrl}"><button data-idx="${idx}">×</button>`;
    thumb.querySelector('button').onclick = () => {
      pendingImages.splice(idx, 1);
      renderPreviews();
    };
    previewBar.appendChild(thumb);
  });
  solveBtn.disabled = pendingImages.length === 0;
}

solveBtn.addEventListener('click', solve);

async function solve() {
  if (pendingImages.length === 0) return;

  solveBtn.disabled = true;
  solveBtn.textContent = 'Đang giải...';
  resultBox.className = '';
  resultBox.textContent = 'AI đang xử lý ảnh, vui lòng chờ...';

  const provider = aiProviderEl.value;

  try {
    let answer;
    if (provider === 'claude') {
      answer = await callClaude(CLAUDE_MODEL);
    } else if (provider === 'claude-fable') {
      answer = await callClaude(CLAUDE_FABLE_MODEL);
    } else {
      answer = await callGPT();
    }
    resultBox.textContent = answer;
  } catch (err) {
    resultBox.className = 'error';
    resultBox.textContent = 'Lỗi khi gọi API: ' + err.message;
  } finally {
    solveBtn.disabled = false;
    solveBtn.textContent = 'Giải bài';
  }
}

// ---- Gọi Claude (cú pháp Anthropic Messages API) ----
async function callClaude(modelName) {
  const contentBlocks = [];
  pendingImages.forEach(img => {
    contentBlocks.push({
      type: 'image',
      source: { type: 'base64', media_type: img.mediaType, data: img.base64 }
    });
  });
  contentBlocks.push({ type: 'text', text: FIXED_PROMPT });

  const res = await fetch(`${BASE_URL}/v1/messages`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: modelName,
      max_tokens: 15000,
      output_config: { effort: 'high' },
      messages: [
        { role: 'user', content: contentBlocks }
      ]
    })
  });

  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return (data.content || [])
    .filter(b => b.type === 'text')
    .map(b => b.text)
    .join('\n') || '(Không có nội dung trả về)';
}

// ---- Gọi GPT-5.5 (cú pháp OpenAI Chat Completions API) ----
async function callGPT() {
  const contentBlocks = [
    { type: 'text', text: FIXED_PROMPT }
  ];
  pendingImages.forEach(img => {
    contentBlocks.push({
      type: 'image_url',
      image_url: { url: `data:${img.mediaType};base64,${img.base64}` }
    });
  });

  const res = await fetch(`${BASE_URL}/v1/chat/completions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: GPT_MODEL,
      messages: [
        { role: 'user', content: contentBlocks }
      ]
    })
  });

  if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '(Không có nội dung trả về)';
}
</script>

</body>
</html>
