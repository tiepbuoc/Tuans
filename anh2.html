
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chatbot (Custom Endpoint)</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #262626;
    --border: #3a3a3a;
    --text: #e8e8e8;
    --muted: #9a9a9a;
    --accent: #4f8cff;
    --user-bubble: #3a5a9a;
    --bot-bubble: #333333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    margin-right: auto;
  }
  header input[type="text"], header input[type="password"] {
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  #apiKey { width: 220px; }
  #modelName { width: 170px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 72%;
    padding: 10px 13px;
    border-radius: 12px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border-bottom-left-radius: 3px;
  }
  .msg.error {
    align-self: flex-start;
    background: #5a2a2a;
    color: #ffb3b3;
  }
  .msg img {
    max-width: 220px;
    border-radius: 8px;
    display: block;
    margin-top: 6px;
  }
  .msg .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    display: block;
  }

  #imgPreviewBar {
    display: flex;
    gap: 8px;
    padding: 8px 16px 0 16px;
    flex-wrap: wrap;
  }
  .preview-thumb {
    position: relative;
    width: 56px;
    height: 56px;
  }
  .preview-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .preview-thumb button {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #b03a3a;
    color: white;
    border: none;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
  }

  #inputBar {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #inputBar textarea {
    flex: 1;
    resize: none;
    background: #1a1a1a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    min-height: 40px;
    max-height: 140px;
  }
  #inputBar button, #inputBar label.icon-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  #inputBar label.icon-btn {
    background: #3a3a3a;
  }
  #inputBar button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #fileInput { display: none; }
  .hint {
    font-size: 12px;
    color: var(--muted);
    padding: 0 16px 6px 16px;
  }
</style>
</head>
<body>

<header>
  <h1>Claude Chatbot — Custom Endpoint</h1>
  <input type="text" id="modelName" value="claude-sonnet-5" placeholder="Tên model">
  <input type="password" id="apiKey" value="sk-oQ6pVNE2opDGFIjYUJBGmce4zGebF3nMpXHOWWm9kenYc3m2" placeholder="Dán API key vào đây">
</header>

<div class="hint">
  Endpoint: <code>https://api.shopaikey.com/v1/messages</code> — API key chỉ lưu trong bộ nhớ trình duyệt của phiên hiện tại, không gửi đi đâu khác ngoài endpoint trên.
</div>

<div id="chat"></div>

<div id="imgPreviewBar"></div>

<div id="inputBar">
  <label class="icon-btn" for="fileInput">📎 Ảnh</label>
  <input type="file" id="fileInput" accept="image/*" multiple>
  <textarea id="userInput" placeholder="Nhập tin nhắn..." rows="1"></textarea>
  <button id="sendBtn">Gửi</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const fileInput = document.getElementById('fileInput');
const previewBar = document.getElementById('imgPreviewBar');
const apiKeyEl = document.getElementById('apiKey');
const modelEl = document.getElementById('modelName');

// Endpoint cố định theo yêu cầu — có thể đổi lại nếu API của bạn dùng path khác
const API_URL = 'https://api.shopaikey.com/v1/messages';

let pendingImages = []; // { base64, mediaType, dataUrl }
let history = []; // lưu lịch sử hội thoại để gửi kèm mỗi request

// ---- Xử lý chọn ảnh ----
fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  for (const file of files) {
    const dataUrl = await fileToDataURL(file);
    const base64 = dataUrl.split(',')[1];
    pendingImages.push({
      base64,
      mediaType: file.type || 'image/png',
      dataUrl
    });
  }
  renderPreviews();
  fileInput.value = '';
});

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderPreviews() {
  previewBar.innerHTML = '';
  pendingImages.forEach((img, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'preview-thumb';
    thumb.innerHTML = `<img src="${img.dataUrl}"><button data-idx="${idx}">×</button>`;
    thumb.querySelector('button').onclick = () => {
      pendingImages.splice(idx, 1);
      renderPreviews();
    };
    previewBar.appendChild(thumb);
  });
}

// ---- Gửi tin nhắn ----
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

function addMessageToUI(role, text, images = []) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = role === 'user' ? 'Bạn' : (role === 'error' ? 'Lỗi' : 'Claude');
  div.appendChild(label);

  const textNode = document.createElement('div');
  textNode.textContent = text;
  div.appendChild(textNode);

  images.forEach(img => {
    const imEl = document.createElement('img');
    imEl.src = img.dataUrl;
    div.appendChild(imEl);
  });

  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text && pendingImages.length === 0) return;

  const apiKey = apiKeyEl.value.trim();
  if (!apiKey) {
    alert('Vui lòng nhập API key trước.');
    return;
  }

  // Hiện tin nhắn user lên UI
  addMessageToUI('user', text, pendingImages);

  // Xây content block theo format Anthropic Messages API
  const contentBlocks = [];
  pendingImages.forEach(img => {
    contentBlocks.push({
      type: 'image',
      source: { type: 'base64', media_type: img.mediaType, data: img.base64 }
    });
  });
  if (text) {
    contentBlocks.push({ type: 'text', text });
  }

  history.push({ role: 'user', content: contentBlocks });

  inputEl.value = '';
  pendingImages = [];
  renderPreviews();
  sendBtn.disabled = true;

  const thinkingDiv = addMessageToUI('bot', 'Đang trả lời...');

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: modelEl.value.trim() || 'claude-sonnet-5',
        max_tokens: 1024,
        messages: history
      })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const data = await res.json();
    const replyText = (data.content || [])
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n') || '(Không có nội dung trả về)';

    thinkingDiv.querySelector('div').textContent = replyText;
    history.push({ role: 'assistant', content: replyText });

  } catch (err) {
    thinkingDiv.remove();
    addMessageToUI('error', 'Lỗi khi gọi API: ' + err.message);
    history.pop(); // bỏ tin nhắn user cuối vì request thất bại
  } finally {
    sendBtn.disabled = false;
  }
}
</script>

</body>
</html>
